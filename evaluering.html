<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluering — Winecoding</title>
  <meta name="description" content="Evaluering kommer snart.">
  <meta name="robots" content="noindex, nofollow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Evaluering — AI-superskills for ledere">
  <meta property="og:description" content="Fortell oss hva du synes om workshopen 6. mars. Det tar ca. 3 minutter.">
  <meta property="og:locale" content="nb_NO">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #FAFAF8;
      color: #2C2C2C;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .serif { font-family: 'Instrument Serif', Georgia, serif; }

    /* --- Topbar --- */
    .topbar {
      border-bottom: 1px solid #E8E5DF;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .dot {
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 9999px;
      background: #C4522A;
      flex-shrink: 0;
    }
    .topbar-name {
      font-size: 0.875rem;
      color: #888;
    }
    .topbar-label {
      font-size: 0.7rem;
      color: #AAA;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* --- Main content --- */
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    section { margin-bottom: 5rem; }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #C4522A;
      margin-bottom: 0.5rem;
      display: block;
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      color: #1A1A1A;
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }
    h1 span { color: #888; }

    h2 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 2rem;
      color: #1A1A1A;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }

    .intro-text {
      color: #555;
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    p { color: #444; margin-bottom: 1.25rem; line-height: 1.75; }
    p:last-child { margin-bottom: 0; }

    strong { color: #1A1A1A; }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #D8D5CF 20%, #D8D5CF 80%, transparent);
      margin: 2rem 0;
    }

    a { color: #C4522A; }

    /* --- Survey form --- */
    .survey-intro {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 2.5rem;
    }
    .form-label {
      display: block;
      font-weight: 500;
      color: #1A1A1A;
      margin-bottom: 0.25rem;
      font-size: 1rem;
    }
    .form-hint {
      display: block;
      color: #888;
      font-size: 0.8rem;
      margin-bottom: 0.75rem;
    }
    .form-required {
      color: #C4522A;
      margin-left: 0.15rem;
    }

    /* Section divider within form */
    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #C4522A;
      margin-bottom: 1.5rem;
      padding-top: 1rem;
      display: block;
    }

    /* Checkbox + radio groups */
    .option-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #FFFFFF;
      border: 1px solid #E8E5DF;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 0.9rem;
      color: #444;
    }
    .option-item:hover {
      border-color: rgba(196,82,42,0.3);
    }
    .option-item.selected {
      border-color: #C4522A;
      background: #FFF8F5;
    }

    .option-item input[type="checkbox"],
    .option-item input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 1.125rem;
      height: 1.125rem;
      border: 1.5px solid #C0BDB8;
      border-radius: 0.25rem;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      background: #fff;
      transition: border-color 0.15s, background 0.15s;
    }
    .option-item input[type="radio"] {
      border-radius: 9999px;
    }
    .option-item input[type="checkbox"]:checked,
    .option-item input[type="radio"]:checked {
      background: #C4522A;
      border-color: #C4522A;
    }
    .option-item input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 0.3rem;
      top: 0.1rem;
      width: 0.3rem;
      height: 0.55rem;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .option-item input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 0.375rem;
      height: 0.375rem;
      background: white;
      border-radius: 9999px;
    }

    /* "Annet" freetext that appears under a checkbox */
    .option-other-text {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #E8E5DF;
      border-radius: 0.375rem;
      background: #FFFFFF;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      color: #2C2C2C;
      margin-top: 0.5rem;
      display: none;
      transition: border-color 0.2s;
    }
    .option-other-text:focus {
      outline: none;
      border-color: #C4522A;
    }
    .option-other-text::placeholder { color: #BBB; }

    /* --- Rating scale (1-10) --- */
    .rating-scale {
      display: flex;
      gap: 0.375rem;
      flex-wrap: wrap;
    }
    .rating-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      background: #FFFFFF;
      border: 1.5px solid #E8E5DF;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
      font-weight: 500;
      color: #888;
    }
    .rating-item:hover {
      border-color: rgba(196,82,42,0.4);
      color: #C4522A;
    }
    .rating-item.selected {
      background: #C4522A;
      border-color: #C4522A;
      color: white;
    }
    .rating-item input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .rating-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #AAA;
    }

    /* --- NPS scale (0-10) with color gradient --- */
    .nps-scale {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
    }
    .nps-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      background: #FFFFFF;
      border: 1.5px solid #E8E5DF;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95rem;
      font-weight: 500;
      color: #888;
      position: relative;
    }
    .nps-item:hover {
      transform: translateY(-2px);
    }
    .nps-item.selected {
      color: white;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .nps-item input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    /* NPS color gradient on selection */
    .nps-item[data-value="0"].selected { background: #D93025; }
    .nps-item[data-value="1"].selected { background: #E23E2E; }
    .nps-item[data-value="2"].selected { background: #E85630; }
    .nps-item[data-value="3"].selected { background: #EC6E33; }
    .nps-item[data-value="4"].selected { background: #F08636; }
    .nps-item[data-value="5"].selected { background: #F4A038; }
    .nps-item[data-value="6"].selected { background: #F4B93B; }
    .nps-item[data-value="7"].selected { background: #C5C43A; }
    .nps-item[data-value="8"].selected { background: #8CB83E; }
    .nps-item[data-value="9"].selected { background: #5AAD3F; }
    .nps-item[data-value="10"].selected { background: #34A853; }

    .nps-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #AAA;
    }

    @media (max-width: 500px) {
      .rating-scale { gap: 0.3rem; }
      .rating-item { width: 2.5rem; height: 2.5rem; font-size: 0.9rem; }
      .nps-scale { gap: 0.2rem; }
      .nps-item { width: 2.25rem; height: 2.25rem; font-size: 0.85rem; }
    }

    /* Textarea */
    .form-textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.875rem 1rem;
      border: 1px solid #E8E5DF;
      border-radius: 0.5rem;
      background: #FFFFFF;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      color: #2C2C2C;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s;
    }
    .form-textarea:focus {
      outline: none;
      border-color: #C4522A;
    }
    .form-textarea::placeholder {
      color: #BBB;
    }

    /* Text input */
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #E8E5DF;
      border-radius: 0.5rem;
      background: #FFFFFF;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      color: #2C2C2C;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: #C4522A;
    }
    .form-input::placeholder { color: #BBB; }

    /* Submit */
    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #C4522A;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.875rem 2rem;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }
    .submit-btn:hover { background: #A8431F; }
    .submit-btn:active { transform: scale(0.99); }

    /* Success state */
    .form-success {
      display: none;
      text-align: center;
      padding: 3rem 1.5rem;
    }
    .form-success.show {
      display: block;
    }
    .success-check {
      width: 3rem;
      height: 3rem;
      border-radius: 9999px;
      background: #E8F5F0;
      border: 1px solid #A8DCCC;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      font-size: 1.25rem;
      color: #2A9D7A;
    }
    .form-success h3 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .form-success p {
      color: #555;
      font-size: 0.95rem;
    }

    /* --- Footer --- */
    footer {
      text-align: center;
      color: #AAA;
      font-size: 0.875rem;
      line-height: 1.8;
      padding-bottom: 2rem;
    }
    footer span { color: #888; }

    .footer-logo {
      display: block;
      margin: 0 auto 0.75rem;
      height: 18px;
      opacity: 0.25;
    }

    @media print {
      body { background: white; }
      .form-group { break-inside: avoid; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <div class="dot"></div>
      <span class="topbar-name">AI-superskills for ledere</span>
    </div>
    <span class="topbar-label">Evaluering</span>
  </div>

  <main>

    <section>
      <span class="eyebrow">Winecoding</span>
      <h1 class="serif">Evaluering<br><span>kommer snart</span></h1>
      <p class="intro-text">Denne siden er ikke tilgjengelig enn&aring;.</p>
    </section>

    <div class="divider"></div>
    <footer>
      <img src="wordmark-dark.png" alt="Winecoding" class="footer-logo" style="height: 22px;">
      <a href="https://www.winecoding.ai/" style="color: #888; text-decoration: none;">winecoding.ai</a>
    </footer>

  </main>

  <script>
    // Interactive selection states for option items
    document.querySelectorAll('.option-item input').forEach(input => {
      input.addEventListener('change', () => {
        const group = input.closest('.option-group');
        if (!group) return;

        if (input.type === 'radio') {
          group.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
        }

        const parent = input.closest('.option-item');
        if (input.checked) {
          parent.classList.add('selected');
        } else {
          parent.classList.remove('selected');
        }

        // Show/hide "Annet" text field
        if (parent.dataset.hasOther === 'true') {
          const textField = parent.querySelector('.option-other-text');
          if (textField) {
            textField.style.display = input.checked ? 'block' : 'none';
            if (input.checked) textField.focus();
          }
        }
      });
    });

    // Rating scale (1-10)
    document.querySelectorAll('.rating-scale').forEach(scale => {
      scale.querySelectorAll('.rating-item').forEach(item => {
        item.addEventListener('click', () => {
          scale.querySelectorAll('.rating-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
        });
      });
    });

    // NPS scale (0-10)
    document.querySelectorAll('.nps-scale').forEach(scale => {
      scale.querySelectorAll('.nps-item').forEach(item => {
        item.addEventListener('click', () => {
          scale.querySelectorAll('.nps-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
        });
      });
    });

    // Form submission via Formspree with AJAX
    const form = document.getElementById('survey-form');
    const successEl = document.getElementById('form-success');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = form.querySelector('.submit-btn');
      btn.textContent = 'Sender...';
      btn.disabled = true;

      const data = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          form.style.display = 'none';
          document.getElementById('hero-section').style.display = 'none';
          successEl.classList.add('show');
          successEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          btn.textContent = 'Noe gikk galt — prøv igjen';
          btn.disabled = false;
        }
      } catch (err) {
        btn.textContent = 'Noe gikk galt — prøv igjen';
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
